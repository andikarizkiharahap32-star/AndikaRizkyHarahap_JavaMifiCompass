# ═══════════════════════════════════════════════════════════════
# JavaMifi Compass — Nginx Reverse Proxy
# ═══════════════════════════════════════════════════════════════
# Routes all traffic through a single entry point:
#   /         → web (Next.js)     :3000
#   /api      → api (NestJS)      :3001
#   /admin    → admin (Vite React) :3002
#   /n8n      → n8n               :5678
#   /mailpit  → mailpit           :8025
# ═══════════════════════════════════════════════════════════════

worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
    multi_accept on;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # ── Logging ──
    log_format main '$remote_addr - $remote_user [$time_local] '
                    '"$request" $status $body_bytes_sent '
                    '"$http_referer" "$http_user_agent" '
                    'rt=$request_time';

    access_log /var/log/nginx/access.log main;

    # ── Performance ──
    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    client_max_body_size 20m;

    # ── Gzip ──
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        image/svg+xml
        font/woff2;

    # ── Rate Limiting Zones ──
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=30r/s;
    limit_req_zone $binary_remote_addr zone=general_limit:10m rate=50r/s;

    # ── Upstreams ──
    upstream web_upstream {
        server web:3000;
        keepalive 32;
    }

    upstream api_upstream {
        server api:3001;
        keepalive 32;
    }

    upstream admin_upstream {
        server admin:3002;
        keepalive 32;
    }

    upstream n8n_upstream {
        server n8n:5678;
        keepalive 8;
    }

    upstream mailpit_upstream {
        server mailpit:8025;
        keepalive 4;
    }

    # ── Main Server Block ──
    server {
        listen 80;
        server_name _;

        # ── Security Headers ──
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        # ── Health Check Endpoint ──
        location /health {
            access_log off;
            return 200 '{"status":"ok","service":"javamifi-proxy"}';
            add_header Content-Type application/json;
        }

        # ── API (NestJS) ──
        location /api {
            limit_req zone=api_limit burst=20 nodelay;

            # Strip /api prefix before forwarding
            rewrite ^/api/?(.*) /$1 break;

            proxy_pass http://api_upstream;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Request-ID $request_id;

            proxy_connect_timeout 10s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;

            # Don't buffer API responses
            proxy_buffering off;
        }

        # ── Admin Panel (Vite React) ──
        location /admin {
            limit_req zone=general_limit burst=30 nodelay;

            # Strip /admin prefix before forwarding
            rewrite ^/admin/?(.*) /$1 break;

            proxy_pass http://admin_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # ── n8n (Workflow Automation) ──
        location /n8n {
            # Strip /n8n prefix before forwarding
            rewrite ^/n8n/?(.*) /$1 break;

            proxy_pass http://n8n_upstream;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_connect_timeout 10s;
            proxy_send_timeout 120s;
            proxy_read_timeout 120s;
        }

        # ── Mailpit (Dev Email UI) ──
        location /mailpit {
            # Strip /mailpit prefix before forwarding
            rewrite ^/mailpit/?(.*) /$1 break;

            proxy_pass http://mailpit_upstream;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # ── Web App (Next.js) — catch-all ──
        location / {
            limit_req zone=general_limit burst=30 nodelay;

            proxy_pass http://web_upstream;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Request-ID $request_id;

            proxy_connect_timeout 10s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
        }
    }
}
