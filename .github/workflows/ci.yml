name: CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  audit-and-scan:
    name: Security & Secret Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Gitleaks Secret Scanner
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  quality-checks:
    name: Lint, Typecheck, and Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9.12.0

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Prisma Client Generation
        run: pnpm --filter @javamifi/api db:generate

      - name: Run ESLint (including no-hardcoded-strings i18n rule)
        run: pnpm lint

      - name: TypeScript Typecheck
        run: pnpm typecheck

      - name: Run Unit Tests (Planner, Pricing, State Machine, Signatures)
        run: pnpm test:unit

      - name: Build Monorepo (Apps & Packages)
        run: pnpm build
